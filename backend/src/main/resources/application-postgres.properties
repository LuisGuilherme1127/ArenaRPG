# Ative com --spring.profiles.active=postgres e configure as variaveis no ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# A aplicacao deve subir mesmo se o banco estiver indisponivel para que o healthcheck retorne 503.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000

# A estrutura e os dados sao administrados manualmente pelo DBeaver nesta etapa.
spring.sql.init.mode=never

